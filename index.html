<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>For You 💝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Caveat:wght@600;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #1e0716;
    --bg2: #5c1237;
    --pink: #ff6fa5;
    --rose: #e8335f;
    --cream: #fff4f0;
    --s: 1;
    /* box + ribbon colours (overwritten from CONFIG.box by the script) */
    --box-hi: #ff7898; --box-lt: #ff4f78; --box: #e8335f; --box-dk: #c21f4c;
    --box-in1: #e04a72; --box-in2: #b0204c; --box-in3: #6b0f2e;
    --floor1: #8a1638; --floor2: #4e0a22; --under1: #c42552; --under2: #7d1131;
    --rib: #ffd36e; --rib-dk: #f3b33d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Quicksand', sans-serif;
    background: #07020a;
    color: var(--cream);
    overflow: hidden;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overscroll-behavior: none;
  }

  /* ---------- floating background hearts ---------- */
  /* romantic glow that fades in once the gift is opened */
  .ambient {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at 50% 40%, var(--bg2), var(--bg1) 72%);
    opacity: 0;
    transition: opacity 2.2s ease;
    pointer-events: none;
    z-index: 0;
  }
  .ambient.on { opacity: 1; }



  .bg-hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; transition: opacity 1s; }
  .bg-heart {
    position: absolute;
    bottom: -40px;
    color: var(--pink);
    opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg); opacity: 0; }
    10%  { opacity: var(--o, .5); }
    100% { transform: translateY(-115vh) rotate(30deg); opacity: 0; }
  }

  /* ---------- hint text ---------- */
  .hint {
    position: fixed;
    top: 9vh; left: 0; right: 0;
    font-family: 'Dancing Script', cursive;
    font-size: 2.1rem;
    line-height: 1.15;
    text-align: center;
    text-shadow: 0 0 18px rgba(255,111,165,.6);
    z-index: 4;
    transition: opacity .5s;
    pointer-events: none;
  }
  .hint .line { animation: fadeIn 1s ease both, pulseText 2.4s ease-in-out 1s infinite; display: inline-block; }
  .hint small {
    display: block;
    margin-top: 10px;
    font-family: 'Quicksand', sans-serif;
    font-size: .95rem;
    opacity: .75;
  }
  .hint .arrow { display: inline-block; animation: nudge 1.4s ease-in-out infinite; }
  .hint-out {
    position: fixed;
    bottom: 4vh; left: 0; right: 0;
    text-align: center;
    font-size: .9rem;
    color: rgba(255,244,240,.75);
    text-shadow: 0 1px 6px rgba(0,0,0,.6);
    z-index: 4;
    opacity: 0;
    transition: opacity .6s;
    pointer-events: none;
  }
  .hint-out.on { opacity: 1; }
  @keyframes nudge { 50% { transform: translateY(-6px) scale(1.15); } }
  @keyframes pulseText { 50% { transform: scale(1.05); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }

  /* ---------- 3D scene ---------- */
  .scene {
    position: fixed;
    left: 50%;
    top: 64%;
    width: 0; height: 0;
    perspective: 1100px;
    perspective-origin: 50% -120px;
    z-index: 2;
  }
  .scaler { transform: scale(var(--s)); transform-style: preserve-3d; }
  .world {
    position: absolute;
    transform-style: preserve-3d;
    animation: dropIn 1.1s cubic-bezier(.3,1.5,.5,1) both;
  }
  @keyframes dropIn { from { translate: 0 -120vh; } }
  .world * { transform-style: preserve-3d; }
  .face, .plane {
    position: absolute;
    left: 50%; top: 50%;
    backface-visibility: visible;
  }

  /* box: 180 wide, 160 tall, 180 deep (rim at y=-80, floor at y=+80) */
  .box { position: absolute; cursor: pointer; }
  .box.opened { cursor: zoom-in; }
  .box.inside { cursor: default; }
  .box > .side {
    width: 180px; height: 160px;
    margin: -80px 0 0 -90px;
    backface-visibility: hidden;
    background:
      linear-gradient(rgba(40,0,15,var(--sh,0)), rgba(40,0,15,var(--sh,0))),
      linear-gradient(90deg, transparent 76px, var(--rib) 76px, var(--rib-dk) 104px, transparent 104px),
      linear-gradient(160deg, var(--box-lt), var(--box-dk));
    border-radius: 4px;
  }
  .box:not(.opened) > .side { height: 146px; margin-top: -66px; }  /* walls stop under the closed lid */
  .box > .side, .box > .inwall { transform-origin: 50% 100%; transition: transform 1.2s cubic-bezier(.5,0,.3,1.25); }
  .box > .front { transform: translateZ(90px) rotateX(0deg); }
  .box > .back  { transform: rotateY(180deg) translateZ(90px) rotateX(0deg); --sh: .32; }
  .box > .right { transform: rotateY(90deg)  translateZ(90px) rotateX(0deg); --sh: .22; }
  .box > .left  { transform: rotateY(-90deg) translateZ(90px) rotateX(0deg); --sh: .12; }
  /* 'unfold' mode: the four walls fall outward, hinged at the floor */
  .box.unfolded > .front { transform: translateZ(90px) rotateX(-90deg); }
  .box.unfolded > .back  { transform: rotateY(180deg) translateZ(90px) rotateX(-90deg); transition-delay: .12s; }
  .box.unfolded > .right { transform: rotateY(90deg)  translateZ(90px) rotateX(-90deg); transition-delay: .24s; }
  .box.unfolded > .left  { transform: rotateY(-90deg) translateZ(90px) rotateX(-90deg); transition-delay: .36s; }
  .box.unfolded > .in-front { transform: rotateY(180deg) translateZ(-89px) rotateX(90deg); }
  .box.unfolded > .in-back  { transform: translateZ(-89px) rotateX(90deg); transition-delay: .12s; }
  .box.unfolded > .in-right { transform: rotateY(270deg) translateZ(-89px) rotateX(90deg); transition-delay: .24s; }
  .box.unfolded > .in-left  { transform: rotateY(90deg)  translateZ(-89px) rotateX(90deg); transition-delay: .36s; }

  /* 'taps' mode: the box hops a little higher each tap */
  .box.hop { animation: hop .55s cubic-bezier(.3,1.6,.5,1); }
  @keyframes hop {
    0%   { transform: none; }
    30%  { transform: translateY(calc(var(--hop, 20) * -1px)) rotateZ(calc(var(--tw, 6) * 1deg)) rotateX(calc(var(--tw, 6) * .6deg)); }
    60%  { transform: translateY(0) rotateZ(calc(var(--tw, 6) * -1deg)); }
    80%  { transform: rotateZ(calc(var(--tw, 6) * .4deg)); }
    100% { transform: none; }
  }
  .burst {
    position: fixed;
    pointer-events: none;
    z-index: 3;
    font-size: 20px;
    animation: burst 1s ease-out forwards;
  }
  @keyframes burst {
    from { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
    to   { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(1.1) rotate(var(--r)); opacity: 0; }
  }

  /* inner lining, only exists once the box is open */
  .box > .inwall {
    width: 178px; height: 160px;
    margin: -80px 0 0 -89px;
    backface-visibility: hidden;
    background: linear-gradient(0deg, var(--box-in3), var(--box-in2) 70%, var(--box-in1));
    display: none;
  }
  .box.opened > .inwall { display: block; }
  .box > .in-front { transform: rotateY(180deg) translateZ(-89px) rotateX(0deg); }
  .box > .in-back  { transform: translateZ(-89px) rotateX(0deg); }
  .box > .in-right { transform: rotateY(270deg) translateZ(-89px) rotateX(0deg); }
  .box > .in-left  { transform: rotateY(90deg)  translateZ(-89px) rotateX(0deg); }

  /* lid: 200 x 36 x 200 */
  .lid { position: absolute; transform: translateY(-86px); }   /* angle set in JS (hinged at the back edge) */
  .lid .under {
    width: 200px; height: 200px;
    margin: -100px 0 0 -100px;
    transform: translateY(18px) rotateX(90deg);
    background: linear-gradient(135deg, var(--under1), var(--under2));
    border-radius: 3px;
    display: none;
  }
  .box.opened .lid .under { display: block; }
  .lid .side {
    width: 200px; height: 36px;
    margin: -18px 0 0 -100px;
    background:
      linear-gradient(rgba(40,0,15,var(--sh,0)), rgba(40,0,15,var(--sh,0))),
      linear-gradient(90deg, transparent 85px, var(--rib) 85px, var(--rib-dk) 115px, transparent 115px),
      linear-gradient(160deg, var(--box-lt), var(--box));
    border-radius: 3px;
  }
  .lid .front { transform: translateZ(100px); }
  .lid .back  { transform: rotateY(180deg) translateZ(100px); --sh: .32; }
  .lid .right { transform: rotateY(90deg)  translateZ(100px); --sh: .22; }
  .lid .left  { transform: rotateY(-90deg) translateZ(100px); --sh: .12; }
  .lid .top {
    width: 200px; height: 200px;
    margin: -100px 0 0 -100px;
    background:
      linear-gradient(90deg, transparent 85px, var(--rib) 85px, var(--rib-dk) 115px, transparent 115px),
      linear-gradient(0deg,  transparent 85px, var(--rib) 85px, var(--rib-dk) 115px, transparent 115px),
      linear-gradient(135deg, var(--box-hi), var(--box));
    border-radius: 3px;
    transform: translateY(-18px) rotateX(90deg);
  }
  /* opening: the lid pops up, then tumbles away in 3D */
  .box.opened .lid { pointer-events: none; animation: lidAway 2s cubic-bezier(.3,.1,.4,1) forwards; }
  .box.gone .lid { display: none; }
  @keyframes lidAway {
    0%   { transform: translateY(-86px); }
    22%  { transform: translate3d(0, -190px, 0) rotateX(-12deg) rotateZ(-6deg); }
    100% { transform: translate3d(420px, -900px, -260px) rotateX(-200deg) rotateY(120deg) rotateZ(60deg); }
  }

  /* 3D bow (built in JS) */
  .bow { position: absolute; transform: translateY(-20px); }
  .bow .loop, .bow .knot, .bow .tail { position: absolute; }
  .bow .seg { position: absolute; left: 0; top: 0; backface-visibility: hidden; }
  .bow .tail .seg { backface-visibility: visible; }

  /* floor shadow */
  .shadow {
    width: 320px; height: 320px;
    margin: -160px 0 0 -160px;
    background: radial-gradient(closest-side, rgba(0,0,0,.5), transparent);
    transform: translateY(82px) rotateX(90deg);
    transition: opacity .8s;
  }

  /* ---------- the floor of the box: note + roses ---------- */
  .floor {
    width: 177px; height: 177px;
    margin: -88.5px 0 0 -88.5px;
    transform: translateY(79px) rotateX(90deg);
    background: radial-gradient(circle at 50% 45%, var(--floor1), var(--floor2) 80%);
    display: none;
  }
  .box.opened .floor { display: block; }

  .note {
    position: absolute;
    left: 50%; top: 50%;
    width: 132px; height: 152px;
    margin: -76px 0 0 -66px;
    transform: translateZ(1px) rotateZ(-4deg);
    background:
      repeating-linear-gradient(180deg, transparent 0 13px, rgba(120,150,200,.28) 13px 14px),
      linear-gradient(160deg, #fffaf3, #fbecdc);
    border-radius: 3px;
    box-shadow: 0 2px 6px rgba(0,0,0,.35);
    color: #6b1530;
    text-align: center;
    padding: 30px 8px 0;
  }
  .note::before { /* red margin line */
    content: '';
    position: absolute;
    left: 16px; top: 0; bottom: 0;
    width: 1px;
    background: rgba(232,51,95,.35);
  }
  .note h1 {
    font-family: 'Dancing Script', cursive;
    font-weight: 700;
    font-size: 19px;
    line-height: 1.05;
    margin-bottom: 14px;
  }
  .options { display: flex; justify-content: center; align-items: center; gap: 6px; padding-left: 8px; }
  .opt {
    position: relative;
    font-family: 'Caveat', 'Dancing Script', cursive;
    font-weight: 700;
    font-size: 17px;
    color: #6b1530;
    background: none;
    border: none;
    padding: 3px 9px;
    white-space: nowrap;
    cursor: pointer;
    transition: font-size .3s;
    pointer-events: none;            /* enabled once you're inside */
  }
  .box.inside .opt { pointer-events: auto; }
  .opt .ring {
    position: absolute;
    left: -4px; top: -3px;
    width: calc(100% + 8px); height: calc(100% + 6px);
    overflow: visible;
    pointer-events: none;
  }
  .opt .ring path {
    fill: none;
    stroke-width: 2.4;
    stroke-linecap: round;
    stroke-dasharray: 101;
    stroke-dashoffset: 101;
    transition: stroke-dashoffset .45s ease;
  }
  .opt.yes .ring path { stroke: #e8335f; }
  .opt.no  .ring path { stroke: #7a6a8a; }
  .opt:hover .ring path, .opt:focus-visible .ring path, .opt.chosen .ring path { stroke-dashoffset: 0; }
  .opt:focus { outline: none; }
  .note .sig {
    margin-top: 8px;
    font-family: 'Caveat', cursive;
    font-size: 11px;
    opacity: .7;
  }

  #roses { position: absolute; inset: 0; pointer-events: none; }
  /* 3D roses: each one is built from layered petal planes that open outward */
  .r3d { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; }
  .r3d .pt {
    position: absolute; left: 0; top: 0;
    transform-origin: 50% 100%;
    border-radius: 50% 50% 42% 42% / 62% 62% 38% 38%;
    backface-visibility: visible;
  }
  .r3d .lf { border-radius: 0; background: none; }
  .r3d .tl { border-radius: 50% 50% 46% 46% / 78% 78% 22% 22%; }
  .r3d .dz { border-radius: 50% 50% 50% 50% / 64% 64% 36% 36%; }
  .r3d .sf { border-radius: 50% 50% 40% 40% / 80% 80% 20% 20%; }
  .r3d .st { border-radius: 1px; }
  .r3d .lf svg { width: 100%; height: 100%; display: block; }


  .petal-loose { position: absolute; left: 50%; top: 50%; pointer-events: none; }

  /* ---------- yes screen ---------- */
  .yay {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 10px;
    opacity: 0; pointer-events: none;
    transition: opacity 1s ease;
    z-index: 20;
    background: radial-gradient(ellipse at center, rgba(92,18,55,.85), rgba(30,7,22,.96));
    perspective: 700px;
  }
  .yay.visible { opacity: 1; pointer-events: auto; }
  .heart3d {
    position: relative;
    width: 120px; height: 120px;
    transform-style: preserve-3d;
    animation: spinHeart 4s linear infinite;
    margin-bottom: 14px;
  }
  .heart3d span {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 100px; line-height: 1;
    filter: drop-shadow(0 0 20px rgba(255,111,165,.8));
  }
  @keyframes spinHeart { to { transform: rotateY(360deg); } }
  .yay h2 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.4rem, 10vw, 3.6rem);
    color: #fff;
    text-shadow: 0 0 20px rgba(255,111,165,.8);
  }
  .yay p { font-size: 1.15rem; opacity: .85; }


  /* ---------- photo slideshow after "Yes" ---------- */
  .yay h2, .yay p { transition: margin 1s ease, font-size 1s ease, opacity 1s; }
  .yay.photos { justify-content: flex-start; padding-top: 3vh; gap: 4px; }
  .yay.photos .heart3d { width: 54px; height: 54px; margin: 0; }
  .yay.photos .heart3d span { font-size: 46px; }
  .heart3d span { transition: font-size 1s ease; }
  .heart3d { transition: width 1s ease, height 1s ease, margin 1s ease; }
  .yay.photos h2 { font-size: clamp(1.8rem, 7vw, 2.6rem); }
  .yay.photos p { opacity: 0; height: 0; }
  .gallery {
    position: relative;
    width: min(84vw, 360px);
    height: min(calc(84vw * 1.2), 432px, 66vh);
    margin-top: 14px;
    perspective: 1000px;
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 1s ease, transform 1s ease;
    display: none;
    touch-action: pan-y;
  }
  .yay.photos .gallery { display: block; }
  .gallery.in { opacity: 1; transform: none; }
  .polaroid {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 100%;
    max-width: calc(66vh / 1.2);
    height: 100%;
    background: #fffaf3;
    padding: 4.5% 4.5% 0;
    border-radius: 4px;
    box-shadow: 0 18px 40px rgba(0,0,0,.45);
    display: flex;
    flex-direction: column;
    transform-style: preserve-3d;
    transition: transform 1s cubic-bezier(.3,1.2,.5,1), opacity .8s ease;
    opacity: 0;
    transform: translateX(70%) rotateY(-75deg) rotateZ(var(--rz));
    pointer-events: none;
  }
  .polaroid.prev { transform: translateX(-70%) rotateY(75deg) rotateZ(var(--rz)); }
  .polaroid.active { opacity: 1; transform: rotateZ(var(--rz)); pointer-events: auto; }
  .polaroid .pic {
    flex: 1;
    min-height: 0;
    background: #2a0a1f center / cover no-repeat;
    border-radius: 2px;
    display: flex; align-items: center; justify-content: center;
    color: #ffb3cc; text-align: center; font-size: .9rem; padding: 10px;
  }
  .polaroid .cap {
    font-family: 'Caveat', 'Dancing Script', cursive;
    font-weight: 700;
    font-size: clamp(1.3rem, 5.5vw, 1.7rem);
    color: #6b1530;
    text-align: center;
    padding: 10px 6px 14px;
  }
  .gal-btn {
    position: absolute;
    top: 50%;
    width: 42px; height: 42px;
    margin-top: -21px;
    border-radius: 50%;
    border: none;
    background: rgba(255,255,255,.85);
    color: #b81d48;
    font-size: 22px;
    cursor: pointer;
    z-index: 2;
    box-shadow: 0 4px 12px rgba(0,0,0,.3);
  }
  .gal-btn.l { left: -14px; }
  .gal-btn.r { right: -14px; }
  .dots { position: absolute; bottom: -26px; left: 0; right: 0; display: flex; gap: 8px; justify-content: center; }
  .dots i { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,.35); transition: background .3s, transform .3s; }
  .dots i.on { background: #ff7eb0; transform: scale(1.3); }

  .confetti {
    position: fixed; top: -40px;
    pointer-events: none;
    z-index: 25;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(118vh) rotateX(720deg) rotateY(360deg) rotateZ(200deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="ambient" id="ambient"></div>
<div class="bg-hearts" id="bgHearts" style="opacity:.2"></div>

<div class="hint" id="hint"><span class="line">A little something<br>for you… tap it 💌</span></div>

<div class="hint-out" id="hintOut"></div>

<div class="scene" id="scene">
  <div class="scaler">
    <div class="world" id="world">
      <div class="plane shadow" id="shadow"></div>

      <div class="box" id="box" role="button" aria-label="Open the gift" tabindex="0">
        <div class="plane floor" id="floor">
          <div class="note" id="note">
            <h1>Will you be<br>my Valentine?</h1>
            <div class="options">
              <button class="opt yes" id="yesBtn">Yes 💖
                <svg class="ring" viewBox="0 0 100 50" preserveAspectRatio="none"><path pathLength="100" d="M60 4 C88 2 99 16 96 28 C92 44 60 48 38 46 C12 44 2 34 4 22 C6 10 24 4 50 4 C62 4 70 6 74 9"/></svg>
              </button>
              <button class="opt no" id="noBtn">No
                <svg class="ring" viewBox="0 0 100 50" preserveAspectRatio="none"><path pathLength="100" d="M60 4 C88 2 99 16 96 28 C92 44 60 48 38 46 C12 44 2 34 4 22 C6 10 24 4 50 4 C62 4 70 6 74 9"/></svg>
              </button>
            </div>
            <div class="sig">— with all my love</div>
          </div>
          <div id="roses"></div>
        </div>

        <div class="face side front"></div>
        <div class="face side back"></div>
        <div class="face side right"></div>
        <div class="face side left"></div>
        <div class="face inwall in-front"></div>
        <div class="face inwall in-back"></div>
        <div class="face inwall in-right"></div>
        <div class="face inwall in-left"></div>

        <div class="lid">
          <div class="face side front"></div>
          <div class="face side back"></div>
          <div class="face side right"></div>
          <div class="face side left"></div>
          <div class="face top"></div>
          <div class="face under"></div>
          <div class="bow" id="bow"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<section class="yay" id="yay">
  <div class="heart3d"><span>💖</span></div>
  <h2>Yay! I love you!</h2>
  <p>Happy Valentine's Day, my love 🌹</p>
  <div class="gallery" id="gallery">
    <button class="gal-btn l" id="galPrev" aria-label="Previous photo">‹</button>
    <button class="gal-btn r" id="galNext" aria-label="Next photo">›</button>
    <div class="dots" id="dots"></div>
  </div>
</section>

<script>
/* =====================================================================
   ✏️  SETTINGS: change everything here (see README.md)
   Tip: builder.html lets you change all of this without touching code.
   ===================================================================== */
/*CONFIG-START*/
const CONFIG = {

  // ---- Gift box colours ---------------------------------------------------
  box: {
    color:  '#e8335f',      // the box and lid
    ribbon: '#ffd36e',      // ribbon and bow
  },

  // ---- How the gift opens --------------------------------------------------
  // 'scroll' : tap to open, then scroll / swipe / pinch to move into the box yourself
  // 'taps'   : tap the box several times (see taps:), then it opens and glides in by itself
  // 'auto'   : one tap, then it opens and glides in by itself
  // 'hold'   : press and hold the box until it bursts open (see holdSeconds:)
  // 'unfold' : one tap, the walls fall open flat, then the camera looks down inside
  reveal: {
    mode: 'scroll',
    taps: 3,                // for 'taps'

  // ---- Words on the page ------------------------------------------------

    yes:         'Yes 💖',

  },

  // ---- Flowers inside the box ---------------------------------------------
  // type:  'rose' | 'tulip' | 'daisy' | 'sunflower' | 'sakura'
  // x, y:  position on the box floor, from -88 (left/top) to 88 (right/bottom); 0,0 = centre
  //        the note covers roughly x -66…66, y -76…76
  // size:  about 20 (small) to 60 (big)
  flowers: [
    { type: 'rose',   color: '#e8335f', x: -60, y: -64, size: 40 },
    { type: 'rose',   color: '#ff5c86', x: -30, y: -76, size: 35 },
    { type: 'daisy',  color: '#ffffff', x: -70, y: -34, size: 34 },
    { type: 'rose',   color: '#d81f4f', x:  62, y: -62, size: 38 },
    { type: 'tulip',  color: '#ff7aa2', x:  30, y: -80, size: 34 },
    { type: 'sakura', color: '#ffc3d6', x:  72, y: -30, size: 30 },
    { type: 'rose',   color: '#ff7aa2', x: -60, y:  58, size: 40 },
    { type: 'tulip',  color: '#e8335f', x: -36, y:  76, size: 34 },
    { type: 'sakura', color: '#ffc3d6', x: -72, y:  36, size: 28 },
    { type: 'rose',   color: '#e8335f', x:  60, y:  60, size: 40 },
    { type: 'daisy',  color: '#ffffff', x:  34, y:  78, size: 32 },
    { type: 'rose',   color: '#ff5c86', x:  72, y:  46, size: 32 },
    { type: 'sakura', color: '#ffc3d6', x:   0, y:  82, size: 28 },
    { type: 'rose',   color: '#d81f4f', x:   2, y: -82, size: 30 },
  ],
  loosePetals: true,        // a few petals scattered over the note

  // ---- Photos shown after they say "Yes" ---------------------------------
  // Put your pictures in the "photos" folder, then list them here.
  // Leave the list empty  ( photos: [] )  to skip the slideshow.
  photos: [
    { src: 'photos/photo1.jpg', caption: 'The day we met 💕' },
    { src: 'photos/photo2.jpg', caption: 'Our favourite place' },
    { src: 'photos/photo3.jpg', caption: 'Many more to come ✨' },
  ],
  slideSeconds: 4,          // how long each photo stays before the next one
  photosDelay: 2.5,         // seconds after "Yes" before the photos appear

  // ---- Sound -------------------------------------------------------------
  sound: {
    music: 'builtin',       // 'builtin' = music box, 'none' = no music, or a file e.g. 'sounds/our-song.mp3'
    musicVolume: 0.85,      // 0 – 1
    effects: true,          // false = no sound effects
    effectsVolume: 0.8,     // 0 – 1
    // Your own sound effects (mp3 / wav / ogg). Leave '' to use the built-in ones.
    files: {
      open:   '',           // when the gift opens
      reveal: '',           // when you reach the note
      hover:  '',           // pointing at Yes / No
      no:     '',           // clicking No
      yes:    '',           // clicking Yes
    },
  },
};
/*CONFIG-END*/

<script>
  const $ = id => document.getElementById(id);
  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const ease = t => t < .5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  const isTouch = matchMedia('(pointer: coarse)').matches;

  /* ---------- apply the words from CONFIG ---------- */
  const T = CONFIG.text;
  $('hint').innerHTML = `<span class="line">${T.tapHint}</span>`;
  {
    // shrink the question so each line fits on the note and Yes / No stay visible
    const h1 = document.querySelector('.note h1');
    h1.innerHTML = T.question;
    const lines = String(T.question).split(/<br\s*\/?>/i).map(x => x.replace(/<[^>]*>/g, '').replace(/&[a-z#0-9]+;/gi, '_'));
    const longest = Math.max(1, ...lines.map(x => [...x].length));
    const fs = Math.max(9, Math.min(19, 112 / (longest * .47), 50 / (1.05 * lines.length)));
    h1.style.fontSize = fs.toFixed(1) + 'px';
    h1.style.whiteSpace = 'nowrap';
  }
  $('yesBtn').firstChild.textContent = T.yes + ' ';
  $('noBtn').firstChild.textContent = T.no + ' ';
  document.querySelector('.note .sig').textContent = T.signature;
  document.querySelector('.yay h2').textContent = T.yesTitle;
  document.querySelector('.yay p').textContent = T.yesSubtitle;

  /* ---------- colours from CONFIG.box ---------- */
  function hexToHsl(hex) {
    let n = parseInt(String(hex).replace('#', '').padEnd(6, '0').slice(0, 6), 16);
    let r = (n >> 16) / 255, g = ((n >> 8) & 255) / 255, b = (n & 255) / 255;
    const mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2;
    let h = 0, sat = 0;
    if (mx !== mn) {
      const d = mx - mn;
      sat = l > .5 ? d / (2 - mx - mn) : d / (mx + mn);
      h = mx === r ? (g - b) / d + (g < b ? 6 : 0) : mx === g ? (b - r) / d + 2 : (r - g) / d + 4;
      h *= 60;
    }
    return [h, sat * 100, l * 100];
  }
  const hsl = (h, sa, l) => `hsl(${h.toFixed(1)}, ${clamp(sa, 0, 100).toFixed(1)}%, ${clamp(l, 2, 97).toFixed(1)}%)`;
  const BOX = CONFIG.box || {};
  const [bh, bs, bl] = hexToHsl(BOX.color || '#e8335f');
  const [rh, rs, rl] = hexToHsl(BOX.ribbon || '#ffd36e');
  {
    const root = document.documentElement.style;
    const set = (k, v) => root.setProperty(k, v);
    set('--box-hi', hsl(bh, bs, bl + 14)); set('--box-lt', hsl(bh, bs, bl + 9));
    set('--box', hsl(bh, bs, bl));         set('--box-dk', hsl(bh, bs, bl - 10));
    set('--box-in1', hsl(bh, bs * .9, bl + 3)); set('--box-in2', hsl(bh, bs * .85, bl - 12)); set('--box-in3', hsl(bh, bs * .8, bl - 30));
    set('--floor1', hsl(bh, bs * .75, bl - 24)); set('--floor2', hsl(bh, bs * .75, bl - 40));
    set('--under1', hsl(bh, bs, bl - 8));  set('--under2', hsl(bh, bs, bl - 28));
    set('--rib', hsl(rh, rs, rl));          set('--rib-dk', hsl(rh, rs, rl - 6));
  }

  /* ---------- background hearts ---------- */
  const bg = $('bgHearts');
  const heartChars = ['❤', '💕', '💗', '♥'];
  for (let i = 0; i < 26; i++) {
    const h = document.createElement('span');
    const depth = Math.random();
    h.className = 'bg-heart';
    h.textContent = heartChars[i % heartChars.length];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (10 + depth * 30) + 'px';
    h.style.filter = `blur(${(1 - depth) * 2.5}px)`;
    h.style.setProperty('--o', (0.25 + depth * 0.45).toFixed(2));
    h.style.animationDuration = (16 - depth * 8) + 's';
    h.style.animationDelay = (Math.random() * 12) + 's';
    bg.appendChild(h);
  }

  /* ---------- 3D bow ---------- */
  const bow = $('bow');
  const gold = l => hsl(rh, rs, l + (rl - 71));   // ribbon colour, shaded
  const place = (el, w, h, t) => {
    el.style.width = w + 'px'; el.style.height = h + 'px';
    el.style.marginLeft = (-w / 2) + 'px'; el.style.marginTop = (-h / 2) + 'px';
    el.style.transform = t;
  };
  function loop(R, width, transform) {
    const g = document.createElement('div');
    g.className = 'loop';
    g.style.transform = transform;
    const N = 22, len = 2 * Math.PI * R / N + 1.2;
    for (let i = 0; i < N; i++) {
      const th = i * 360 / N, c = Math.cos(th * Math.PI / 180);
      const out = document.createElement('div');
      out.className = 'seg';
      place(out, len, width, `rotateZ(${th}deg) translateY(${-R}px) rotateX(-90deg)`);
      out.style.background = `linear-gradient(90deg, ${gold(52 + 14 * c)}, ${gold(60 + 14 * c)})`;
      const inn = document.createElement('div');
      inn.className = 'seg';
      place(inn, len, width, `rotateZ(${th}deg) translateY(${-R}px) rotateX(90deg)`);
      inn.style.background = gold(34 + 8 * c);
      g.append(out, inn);
    }
    bow.appendChild(g);
  }
  [[0, 30, 30], [180, 30, 30], [90, 22, 24], [270, 22, 24]].forEach(([a, R, d]) => {
    loop(R, 20, `rotateY(${a}deg) translate3d(${d}px, ${-R * 0.85 - 3}px, 0) rotateZ(38deg) scale(1.25, .85)`);
  });
  const knot = document.createElement('div');
  knot.className = 'knot';
  knot.style.transform = 'translateY(-15px)';
  for (let i = 0; i < 12; i++) {
    const d = document.createElement('div');
    d.className = 'seg';
    d.style.backfaceVisibility = 'visible';
    d.style.borderRadius = '50%';
    d.style.background = `radial-gradient(circle at 40% 35%, ${hsl(rh, rs, rl + 15)}, ${hsl(rh, rs, rl - 13)} 60%, ${hsl(rh, rs, rl - 30)})`;
    place(d, 26, 26, `rotateY(${i * 15}deg)`);
    knot.appendChild(d);
  }
  bow.appendChild(knot);
  [35, 215].forEach(a => {
    const t = document.createElement('div');
    t.className = 'tail';
    t.style.transform = `rotateY(${a}deg)`;
    const s = document.createElement('div');
    s.className = 'seg';
    s.style.background = 'linear-gradient(90deg, var(--rib-dk), var(--rib))';
    s.style.clipPath = 'polygon(0 0, 100% 0, 88% 50%, 100% 100%, 0 100%)';
    place(s, 70, 20, 'translate3d(38px, 0, 0) rotateX(90deg)');
    t.appendChild(s);
    bow.appendChild(t);
  });

  /* ---------- 3D flowers in the box ---------- */
  const rgbOf = col => {                  // '#rrggbb', '#rgb' or 'rgb(r,g,b)' -> [r,g,b]
    col = String(col).trim();
    if (col.startsWith('rgb')) return col.match(/[\d.]+/g).slice(0, 3).map(Number);
    let h = col.replace('#', '');
    if (h.length === 3) h = h.split('').map(x => x + x).join('');
    const n = parseInt(h.padEnd(6, '0').slice(0, 6), 16) || 0;
    return [n >> 16, (n >> 8) & 255, n & 255];
  };
  const mix = (col, t) => {               // blend a colour toward white (t > 0) or black (t < 0)
    const c = rgbOf(col).map(v => Math.round(t >= 0 ? v + (255 - v) * t : v * (1 + t)));
    return `rgb(${c.join(',')})`;
  };
  function petal(parent, cls, w, h, angle, r, tilt, lift, bg) {
    const p = document.createElement('div');
    p.className = cls;
    p.style.width = w + 'px'; p.style.height = h + 'px';
    p.style.marginLeft = (-w / 2) + 'px'; p.style.marginTop = (-h) + 'px';   // pivot = bottom centre
    p.style.transform = `translateZ(${lift}px) rotateZ(${angle}deg) translateY(${-r}px) rotateX(${-tilt}deg)`;
    if (bg) p.style.background = bg;
    parent.appendChild(p);
    return p;
  }
  function disc(parent, d, z, bg) {
    const c = document.createElement('div');
    c.className = 'pt';
    c.style.cssText = `width:${d}px;height:${d}px;margin:${-d / 2}px 0 0 ${-d / 2}px;transform:translateZ(${z}px);border-radius:50%;background:${bg}`;
    parent.appendChild(c);
    return c;
  }
  function leaves(g, n, S, off, w, h, r, tilt) {
    for (let i = 0; i < n; i++) {
      const lf = petal(g, 'pt lf', S * w, S * h, off + i * (360 / n) + 20, S * r, tilt, 0);
      lf.innerHTML = `<svg viewBox="0 0 20 30" preserveAspectRatio="none"><path d="M10 30 C0 22 0 8 10 0 C20 8 20 22 10 30Z" fill="${i % 2 ? '#4f9d5b' : '#3f8a4c'}"/><path d="M10 29 L10 4" stroke="#2c6a37" stroke-width="1"/></svg>`;
    }
  }
  const FLOWERS = {
    rose: { reach: .62, build(g, S, c, off) {
      const c2 = mix(c, -.12), c3 = mix(c, -.45);
      leaves(g, 3, S, off, .3, .46, .14, 10);
      const grad = k => `linear-gradient(to top, ${c3} 0%, ${k} 50%, ${mix(k, .35)} 100%)`;
      for (let i = 0; i < 5; i++) petal(g, 'pt', S * .5, S * .44, off + i * 72, S * .05, 24, 1, grad(c));
      for (let i = 0; i < 5; i++) petal(g, 'pt', S * .4, S * .36, off + i * 72 + 36, S * .03, 50, 2, grad(c2));
      for (let i = 0; i < 4; i++) petal(g, 'pt', S * .3, S * .27, off + i * 90 + 18, S * .015, 70, 3, grad(c));
      for (let i = 0; i < 3; i++) petal(g, 'pt', S * .2, S * .2, off + i * 120, 0, 84, 3, `linear-gradient(to top, ${c3}, ${c2})`);
      disc(g, S * .14, 3 + S * .17, `radial-gradient(${c3}, ${c2})`);
    }},
    tulip: { reach: .66, build(g, S, c, off) {
      const c3 = mix(c, -.45);
      leaves(g, 2, S, off, .24, .6, .05, 14);
      disc(g, S * .2, 1.5, c3);
      const grad = k => `linear-gradient(to top, ${c3} 0%, ${k} 45%, ${mix(k, .3)} 100%)`;
      for (let i = 0; i < 3; i++) petal(g, 'pt tl', S * .42, S * .55, off + i * 120, S * .07, 70, 1, grad(c));
      for (let i = 0; i < 3; i++) petal(g, 'pt tl', S * .36, S * .5, off + 60 + i * 120, S * .02, 80, 1.5, grad(mix(c, -.1)));
    }},
    daisy: { reach: .6, build(g, S, c, off) {
      leaves(g, 2, S, off, .26, .44, .12, 8);
      for (let i = 0; i < 16; i++)
        petal(g, 'pt dz', S * .13, S * .42, off + i * 22.5, S * .08, 10 + (i % 2) * 7, 1 + (i % 2) * .5,
          `linear-gradient(to top, ${mix(c, -.25)}, ${c} 40%, ${c})`);
      disc(g, S * .3, 2.2, 'radial-gradient(circle at 40% 40%, #ffd75e, #e8a317)');
      disc(g, S * .2, 3.4, 'radial-gradient(circle at 40% 40%, #ffe07a, #f0b429)');
      disc(g, S * .1, 4.4, '#ffe58f');
    }},
    sunflower: { reach: .6, build(g, S, c, off) {
      leaves(g, 3, S, off, .32, .5, .2, 6);
      for (let i = 0; i < 18; i++) petal(g, 'pt sf', S * .15, S * .36, off + i * 20, S * .18, 12, 1,
        `linear-gradient(to top, ${mix(c, -.3)}, ${c} 35%, ${mix(c, .25)})`);
      for (let i = 0; i < 16; i++) petal(g, 'pt sf', S * .13, S * .3, off + 10 + i * 22.5, S * .16, 26, 1.5,
        `linear-gradient(to top, ${mix(c, -.35)}, ${mix(c, -.1)} 40%, ${c})`);
      const seeds = 'radial-gradient(circle, #2e1a06 32%, transparent 36%) 0 0 / 4px 4px, radial-gradient(circle, #7a4a14, #3e2309)';
      disc(g, S * .44, 2.6, seeds);
      disc(g, S * .3, 3.6, seeds);
    }},
    sakura: { reach: .5, build(g, S, c, off, seed) {
      leaves(g, 1, S, off + 30, .24, .36, .1, 6);
      const id = 'sk' + seed;
      for (let i = 0; i < 5; i++) {
        const p = petal(g, 'pt lf', S * .42, S * .46, off + i * 72, S * .03, 26, 1);
        p.innerHTML = `<svg viewBox="0 0 20 30" preserveAspectRatio="none"><defs><linearGradient id="${id}${i}" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="${mix(c, -.3)}"/><stop offset=".45" stop-color="${c}"/><stop offset="1" stop-color="${mix(c, .45)}"/></linearGradient></defs><path d="M10 30 C2 24 0 12 3 4 C5 1 8 1 10 5 C12 1 15 1 17 4 C20 12 18 24 10 30Z" fill="url(#${id}${i})"/></svg>`;
      }
      disc(g, S * .14, 1.8, mix(c, -.4));
      for (let i = 0; i < 10; i++) petal(g, 'pt st', 1.3, S * .2, off + i * 36, S * .02, 55, 2,
        `linear-gradient(to top, ${mix(c, -.45)}, ${mix(c, -.3)} 70%, #ffd34d 72%)`);
    }},
  };
  function buildFlower(f, seed) {
    const g = document.createElement('div');
    g.className = 'r3d';
    const kind = FLOWERS[f.type] || FLOWERS.rose;
    kind.build(g, f.size, f.color || '#e8335f', (seed * 53) % 360, seed);
    return g;
  }

  const rosesEl = $('roses');
  const placed = [];
  (CONFIG.flowers || []).forEach((f0, i) => {
    const f = Object.assign({ type: 'rose', color: '#e8335f', x: 0, y: 0, size: 36 }, f0);
    f.size = clamp(+f.size || 36, 14, 70);
    // keep every petal and leaf inside the box walls (inner walls sit at ±89px)
    const lim = Math.max(0, 85 - f.size * (FLOWERS[f.type] || FLOWERS.rose).reach);
    const x = clamp(+f.x || 0, -lim, lim), y = clamp(+f.y || 0, -lim, lim);
    // flowers listed later sit on top of the ones they overlap
    const under = placed.filter(p => Math.hypot(p.x - x, p.y - y) < (p.size + f.size) * .45).length;
    const h = 1 + Math.min(under, 4) * 3;
    placed.push({ x, y, size: f.size });
    const el = buildFlower(f, i + 1);
    el.style.transform = `translate3d(${x}px, ${y}px, ${h}px)`;
    rosesEl.appendChild(el);
  });
  // a few loose petals scattered over the note
  if (CONFIG.loosePetals !== false) {
    const pc = (CONFIG.flowers && CONFIG.flowers[0] && CONFIG.flowers[0].color) || '#e8335f';
    [[-20, -44, 30, 6], [26, -40, 140, 7], [-8, 40, 250, 8], [30, 22, 80, 7]].forEach(([x, y, a, h]) => {
      const p = document.createElement('div');
      p.className = 'petal-loose';
      p.innerHTML = `<svg viewBox="0 0 20 14" width="11" height="8"><path d="M1 7 C4 0 15 0 19 7 C15 14 4 14 1 7Z" fill="${pc}"/></svg>`;
      place(p, 11, 8, `translate3d(${x}px, ${y}px, ${h}px) rotateZ(${a}deg)`);
      rosesEl.appendChild(p);
    });
  }

  /* ---------- sound (all generated live with Web Audio, no files) ---------- */
  const Sound = (() => {
    let ctx = null, master, music, sfx, noiseBuf, musicOn = false, timer = null;
    const SC = Object.assign({ music: 'builtin', musicVolume: .85, effects: true, effectsVolume: .8 }, CONFIG.sound);
    const files = SC.files || {};
    if (files.music && (!SC.music || SC.music === 'builtin')) SC.music = files.music;   // older setting name
    let songEl = null;

    function init() {
      if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      ctx = new AC();
      master = ctx.createGain(); master.gain.value = 0.9; master.connect(ctx.destination);
      // a little room reverb
      const verb = ctx.createConvolver();
      const len = ctx.sampleRate * 2.2, ir = ctx.createBuffer(2, len, ctx.sampleRate);
      for (let ch = 0; ch < 2; ch++) {
        const d = ir.getChannelData(ch);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
      }
      verb.buffer = ir;
      const wet = ctx.createGain(); wet.gain.value = 0.28;
      verb.connect(wet); wet.connect(master);
      music = ctx.createGain(); music.gain.value = 0; music.connect(master); music.connect(verb);
      sfx = ctx.createGain(); sfx.gain.value = SC.effectsVolume; sfx.connect(master); sfx.connect(verb);
      noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 1.5, ctx.sampleRate);
      const nd = noiseBuf.getChannelData(0);
      for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
    }
    const hz = m => 440 * Math.pow(2, (m - 69) / 12);

    function bell(m, t, vol = .18, dest = sfx, len = 1.6) {     // music-box / chime note
      [[1, 1], [2.01, .28], [3.98, .08]].forEach(([mul, g]) => {
        const o = ctx.createOscillator(), e = ctx.createGain();
        o.type = 'sine'; o.frequency.value = hz(m) * mul;
        e.gain.setValueAtTime(0, t);
        e.gain.linearRampToValueAtTime(vol * g, t + 0.006);
        e.gain.exponentialRampToValueAtTime(0.0001, t + len / mul);
        o.connect(e); e.connect(dest);
        o.start(t); o.stop(t + len + .05);
      });
    }
    function pad(m, t, dur, vol = .05) {                         // soft low note under the music box
      const o = ctx.createOscillator(), e = ctx.createGain(), f = ctx.createBiquadFilter();
      o.type = 'triangle'; o.frequency.value = hz(m);
      f.type = 'lowpass'; f.frequency.value = 600;
      e.gain.setValueAtTime(0, t);
      e.gain.linearRampToValueAtTime(vol, t + .4);
      e.gain.linearRampToValueAtTime(0, t + dur);
      o.connect(f); f.connect(e); e.connect(music);
      o.start(t); o.stop(t + dur + .05);
    }
    function noise(t, dur, type, f0, f1, vol, q = 1) {
      const src = ctx.createBufferSource(), f = ctx.createBiquadFilter(), e = ctx.createGain();
      src.buffer = noiseBuf;
      f.type = type; f.Q.value = q;
      f.frequency.setValueAtTime(f0, t);
      f.frequency.exponentialRampToValueAtTime(f1, t + dur);
      e.gain.setValueAtTime(0, t);
      e.gain.linearRampToValueAtTime(vol, t + dur * .25);
      e.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.connect(f); f.connect(e); e.connect(sfx);
      src.start(t); src.stop(t + dur + .05);
      return e;
    }

    /* background music: a gentle original music-box loop (C – Am – F – G) */
    const chords = [[60, 64, 67, 72], [57, 60, 64, 69], [53, 57, 60, 65], [55, 59, 62, 67]];
    const order = [0, 1, 2, 3, 2, 3, 0, 0];
    const tops  = [79, 76, 77, 74, 72, 74, 76, 72];
    const beat = 60 / 72, eighth = beat / 2;
    let step = 0, next = 0;
    function schedule() {
      while (next < ctx.currentTime + 0.3) {
        const bar = Math.floor(step / 8) % order.length, i = step % 8;
        const ch = chords[order[bar]];
        const pat = [0, 1, 2, 3, 2, 1, 2, 3];
        bell(ch[pat[i]] + 12, next, i === 0 ? .1 : .065, music, 1.4);
        if (i === 0) { pad(ch[0] - 12, next, beat * 4); bell(tops[bar] + 12, next + .01, .07, music, 2.4); }
        if (i === 4 && bar % 2 === 1) bell(tops[(bar + 1) % 8] + 12, next, .05, music, 1.8);
        step++; next += eighth;
      }
    }
    function startMusic() {
      if (!ctx || musicOn) return;
      musicOn = true;
      if (!SC.music || SC.music === 'none') return;
      if (SC.music !== 'builtin') {            // your own song instead of the music box
        songEl = new Audio(SC.music);
        songEl.loop = true;
        songEl.volume = 0;
        songEl.play().catch(() => {});
        let v = 0;                             // gentle fade-in
        const fade = setInterval(() => { v = Math.min(SC.musicVolume, v + .04); songEl.volume = v; if (v >= SC.musicVolume) clearInterval(fade); }, 120);
        return;
      }
      next = ctx.currentTime + .1;
      music.gain.setValueAtTime(0, ctx.currentTime);
      music.gain.linearRampToValueAtTime(SC.musicVolume, ctx.currentTime + 4);
      schedule();
      timer = setInterval(schedule, 60);
    }

    window.addEventListener('pointerdown', init);
    window.addEventListener('keydown', init);

    const ok = () => ctx && ctx.state === 'running' || (ctx && ctx.resume(), !!ctx);
    function custom(name) {                    // play your own file for this moment, if you set one
      if (!SC.effects) return true;            // effects switched off: skip the built-in one too
      if (!files[name]) return false;
      const a = new Audio(files[name]); a.volume = SC.effectsVolume; a.play().catch(() => {});
      return true;
    }
    return {
      startMusic,
      open() {                                  // lid pops, then whooshes away
        if (custom('open')) return;
        if (!ok()) return;
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), e = ctx.createGain();
        o.type = 'sine';
        o.frequency.setValueAtTime(220, t);
        o.frequency.exponentialRampToValueAtTime(700, t + .09);
        e.gain.setValueAtTime(.35, t);
        e.gain.exponentialRampToValueAtTime(.0001, t + .16);
        o.connect(e); e.connect(sfx); o.start(t); o.stop(t + .2);
        noise(t, .08, 'highpass', 2000, 4000, .25);
        noise(t + .3, 1.2, 'bandpass', 300, 2400, .22, .8);
        [72, 76, 79, 84, 88].forEach((m, i) => bell(m + 12, t + .15 + i * .06, .07));
      },
      knock(n) {                                // 'taps' mode: each tap a little higher
        if (!SC.effects || !ok()) return;
        const t = ctx.currentTime;
        noise(t, .06, 'bandpass', 900, 500, .3, 2);
        bell(76 + n * 3, t + .02, .1);
        bell(83 + n * 3, t + .1, .06);
      },
      reveal() {                                // you've reached the note
        if (custom('reveal')) return;
        if (!ok()) return;
        const t = ctx.currentTime;
        [84, 88, 91, 96, 91, 96, 100].forEach((m, i) => bell(m, t + i * .07, .08, sfx, 2));
      },
      scribble() {                              // pencil circling an answer
        if (custom('hover')) return;
        if (!ok()) return;
        const t = ctx.currentTime;
        for (let i = 0; i < 4; i++) noise(t + i * .09, .1, 'bandpass', 3200 + i * 300, 2400, .09, 1.4);
      },
      no() {                                    // a sad little "aww"
        if (custom('no')) return;
        if (!ok()) return;
        const t = ctx.currentTime;
        const o = ctx.createOscillator(), e = ctx.createGain(), lfo = ctx.createOscillator(), lg = ctx.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(520, t);
        o.frequency.exponentialRampToValueAtTime(300, t + .55);
        lfo.frequency.value = 7; lg.gain.value = 9;
        lfo.connect(lg); lg.connect(o.frequency);
        e.gain.setValueAtTime(0, t);
        e.gain.linearRampToValueAtTime(.16, t + .04);
        e.gain.exponentialRampToValueAtTime(.0001, t + .6);
        o.connect(e); e.connect(sfx);
        o.start(t); lfo.start(t); o.stop(t + .65); lfo.stop(t + .65);
      },
      yes() {                                   // happy chime cascade
        if (custom('yes')) return;
        if (!ok()) return;
        const t = ctx.currentTime;
        [72, 76, 79, 84, 88, 91, 96].forEach((m, i) => bell(m, t + i * .08, .12, sfx, 2.2));
        [[60, 64, 67], [65, 69, 72], [67, 71, 74], [72, 76, 79, 84]].forEach((ch, j) =>
          ch.forEach(m => bell(m + 12, t + .7 + j * .32, .07, sfx, 2.5)));
        for (let i = 0; i < 14; i++) bell(96 + Math.floor(Math.random() * 8), t + .5 + Math.random() * 2.2, .03, sfx, .8);
      },
    };
  })();

  /* ---------- camera ---------- */
  const scene = $('scene'), world = $('world'), box = $('box'), hint = $('hint');
  let phase = 'closed';        // closed → opened → inside
  let ry = 30, rx = -16;       // spin while closed
  let zoom = 0, zoomT = 0;     // 0 = outside, 1 = looking down into the box
  let tiltX = 0, tiltY = 0, tiltXT = 0, tiltYT = 0;
  let finalT = 700;

  function fit() {
    const s = Math.min(1, window.innerWidth / 430, window.innerHeight / 780);
    document.documentElement.style.setProperty('--s', s.toFixed(3));
    // how far to push in so the note fills most of the screen
    const target = Math.min(0.7 * window.innerWidth / 132, 0.66 * window.innerHeight / 152);
    finalT = 79 + 1100 - 1100 * s / target;   // scale() doesn't scale z
  }
  fit();
  window.addEventListener('resize', fit);

  let lastTransform = '', lastTime = performance.now();
  function tick(now) {
    const realDt = Math.min(0.5, (now - lastTime) / 1000); lastTime = now;
    const dt = Math.min(0.1, realDt);
    const k = 1 - Math.exp(-dt * 6);     // frame-rate independent smoothing
    const kz = 1 - Math.exp(-dt * 1.8);  // the zoom glides more slowly
    if (phase === 'closed') {
      if (!dragging) ry += 27 * dt;
      let jx = 0, jy = 0;
      if (MODE === 'hold') {
        charge = clamp(charge + (holding ? realDt / HOLD_SECS : -realDt * 1.2), 0, 1);
        jx = (Math.random() - .5) * charge * 7; jy = (Math.random() - .5) * charge * 7;
        box.style.transform = charge > 0 ? `scale(${1 + charge * .08})` : '';
        const filled = Math.round(charge * 5);
        if (filled !== lastFilled) { lastFilled = filled; setHoldHint(filled); }
        if (charge >= 1) { holding = false; box.style.transform = ''; openGift(); }
      }
      setWorld(`rotateX(${rx + jx}deg) rotateY(${ry + jy}deg)`);
    } else {
      // auto-finish once they're most of the way in
      if (zoomT > 0.96) zoomT = 1;
      zoom += (zoomT - zoom) * kz;
      if (Math.abs(zoomT - zoom) < 0.001) zoom = zoomT;
      tiltX += (tiltXT - tiltX) * k;
      tiltY += (tiltYT - tiltY) * k;
      ry += (0 - ry) * k;
      if (Math.abs(ry) < 0.01) ry = 0;

      const eRot = ease(clamp(zoom / 0.7, 0, 1));
      const eIn = ease(zoom);
      const ax = lerp(-30, -90, eRot) + tiltX * lerp(1, 0.35, eIn);
      const ay = tiltY * lerp(1, 0.35, eIn);
      const tz = finalT * eIn;
      scene.style.top = lerp(64, 50, eIn) + '%';
      scene.style.perspectiveOrigin = `50% ${lerp(-120, 0, eIn)}px`;
      $('shadow').style.opacity = 1 - eIn;
      bg.style.opacity = 1 - eIn * 0.7;
      setWorld(`translateZ(${tz.toFixed(2)}px) rotateY(${ay.toFixed(3)}deg) rotateX(${ax.toFixed(3)}deg) rotateY(${ry.toFixed(3)}deg)`);

      // top hint while outside, bottom "zoom out" hint while inside
      if (hintReady) hint.style.opacity = zoomT < 0.25 && zoom < 0.3 ? 1 : 0;
      $('hintOut').classList.toggle('on', phase === 'inside' && zoomT === 1 && !celebrating);

      if (phase === 'opened' && zoom > 0.97) enterInside();
      if (phase === 'inside' && zoomT < 0.9) leaveInside();
    }
    requestAnimationFrame(tick);
  }
  // only touch the DOM when something actually changed, so text re-rasterises sharply when still
  function setWorld(t) {
    if (t !== lastTransform) { world.style.transform = t; lastTransform = t; }
  }
  requestAnimationFrame(tick);

  /* ---------- input ---------- */
  let dragging = false, moved = 0, lastX = 0, lastY = 0;
  const pointers = new Map();
  let pinchStart = 0, pinchZoom = 0;

  window.addEventListener('pointerdown', e => {
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) {
      const [a, b] = [...pointers.values()];
      pinchStart = Math.hypot(a.x - b.x, a.y - b.y);
      pinchZoom = zoomT;
    }
    if (e.target.closest('button')) return;
    dragging = true; moved = 0; lastX = e.clientX; lastY = e.clientY;
  });
  const endPointer = e => { pointers.delete(e.pointerId); if (pointers.size === 0) dragging = false; };
  window.addEventListener('pointerup', endPointer);
  window.addEventListener('pointercancel', endPointer);

  window.addEventListener('pointermove', e => {
    if (celebrating) return;
    if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

    // gentle look-around once the box is open
    if (phase !== 'closed' && e.pointerType === 'mouse') {
      tiltYT = (e.clientX / window.innerWidth - .5) * 24;
      tiltXT = (e.clientY / window.innerHeight - .5) * -10;
    }

    if (pointers.size === 2 && phase !== 'closed') {   // pinch to zoom
      const [a, b] = [...pointers.values()];
      const d = Math.hypot(a.x - b.x, a.y - b.y);
      zoomT = clamp(pinchZoom + (d - pinchStart) / 250, 0, 1);
      return;
    }
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    moved += Math.abs(dx) + Math.abs(dy);
    lastX = e.clientX; lastY = e.clientY;

    if (phase === 'closed') {
      ry += dx * 0.5;
      rx = clamp(rx - dy * 0.3, -40, 5);
    } else {
      zoomT = clamp(zoomT - dy / 600, 0, 1);         // swipe up = move in
    }
  });

  window.addEventListener('wheel', e => {
    e.preventDefault();
    if (celebrating) return;
    if (phase === 'closed') return;
    zoomT = clamp(zoomT + clamp(e.deltaY, -100, 100) * 0.0011, 0, 1);  // scroll down = move in
  }, { passive: false });

  window.addEventListener('keydown', e => {
    if (phase === 'closed' || celebrating) return;
    if (['ArrowUp', '+', '='].includes(e.key)) zoomT = clamp(zoomT + .12, 0, 1);
    if (['ArrowDown', '-'].includes(e.key)) zoomT = clamp(zoomT - .12, 0, 1);
  });

  window.addEventListener('deviceorientation', e => {
    if (phase === 'closed' || e.gamma == null) return;
    tiltYT = clamp(e.gamma, -20, 20);
  });

  /* ---------- open the gift (5 modes, see CONFIG.reveal) ---------- */
  const RV = Object.assign({ mode: 'scroll', taps: 3, holdSeconds: 1.5 }, CONFIG.reveal);
  const MODE = ['scroll', 'taps', 'auto', 'hold', 'unfold'].includes(RV.mode) ? RV.mode : 'scroll';
  const HOLD_SECS = clamp(+RV.holdSeconds || 1.5, .4, 6);
  let tapsLeft = clamp(Math.round(+RV.taps || 3), 1, 20);
  let holding = false, charge = 0, lastFilled = -1;
  const hintLine = T.tapHint;
  function setHint(small) { hint.innerHTML = `<span class="line">${hintLine}</span>${small ? `<small>${small}</small>` : ''}`; }
  function setHoldHint(n) { setHint((isTouch ? 'Press and hold the gift ' : 'Press and hold the gift ') + '💗'.repeat(n) + '🤍'.repeat(5 - n)); }
  if (MODE === 'taps') setHint(`Tap it ${tapsLeft} time${tapsLeft > 1 ? 's' : ''} 💓`);
  if (MODE === 'hold') setHoldHint(0);

  function heartBurst(n) {                     // little hearts popping out of the box
    const r = scene.getBoundingClientRect();
    const sc = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--s')) || 1;
    for (let i = 0; i < n; i++) {
      const h = document.createElement('span');
      h.className = 'burst';
      h.textContent = ['💖', '💗', '💕', '✨'][i % 4];
      const a = Math.random() * Math.PI * 2, d = 90 + Math.random() * 90;
      h.style.left = r.left + 'px'; h.style.top = (r.top - 40 * sc) + 'px';
      h.style.setProperty('--dx', Math.cos(a) * d + 'px');
      h.style.setProperty('--dy', Math.sin(a) * d - 40 + 'px');
      h.style.setProperty('--r', (Math.random() * 80 - 40) + 'deg');
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1100);
    }
  }
  function tapHop() {
    const done = clamp(RV.taps, 1, 20) - tapsLeft;   // taps so far
    box.style.setProperty('--hop', 14 + done * 10);
    box.style.setProperty('--tw', 5 + done * 3);
    box.classList.remove('hop'); void box.offsetWidth; box.classList.add('hop');
    heartBurst(4 + done * 2);
    Sound.knock(done);
    setHint(`${tapsLeft} more time${tapsLeft > 1 ? 's' : ''} 💓`);
  }

  let hintReady = false;
  function openGift() {
    if (phase !== 'closed') return;
    phase = 'opened';
    box.classList.remove('hop');
    if (MODE !== 'scroll') heartBurst(14);
    ry = ((ry % 360) + 540) % 360 - 180;
    rx = -30;
    box.classList.add('opened');
    Sound.open();
    setTimeout(Sound.startMusic, 900);
    setTimeout(() => box.classList.add("gone"), 2100);
    $('ambient').classList.add('on');
    hint.style.opacity = 0;
    const insideHint = () => {
      hintReady = true;
      hint.innerHTML = `<span class="line">${T.insideHint} <span class="arrow">🔍</span></span>
        <small>${isTouch ? 'Swipe up or pinch out to look closer' : 'Scroll down to look closer'}</small>`;
    };
    if (MODE === 'scroll') { setTimeout(insideHint, 1300); return; }
    // every other mode moves you in by itself (you can still scroll out and back in afterwards)
    if (MODE === 'unfold') setTimeout(() => box.classList.add('unfolded'), 700);
    setTimeout(() => { zoomT = 1; }, MODE === 'unfold' ? 2000 : 1200);
    setTimeout(insideHint, 6000);
  }
  box.addEventListener('click', () => {
    if (moved > 8) return;
    if (phase === 'closed') {
      if (MODE === 'hold') return;                                    // opened by holding instead
      if (MODE === 'taps' && --tapsLeft > 0) { tapHop(); return; }
      openGift();
    }
    else if (phase === 'opened') zoomT = clamp(zoomT + 0.2, 0, 1);   // tap also moves you in
  });
  box.addEventListener('pointerdown', () => { if (MODE === 'hold' && phase === 'closed') holding = true; });
  window.addEventListener('pointerup', () => { holding = false; });
  window.addEventListener('pointercancel', () => { holding = false; });
  box.addEventListener('keydown', e => {
    if (e.key !== 'Enter' && e.key !== ' ') return;
    if (phase === 'closed') {
      if (MODE === 'taps' && --tapsLeft > 0) { tapHop(); return; }
      openGift();
    } else if (phase === 'opened') zoomT = clamp(zoomT + .2, 0, 1);
  });

  $('hintOut').textContent = isTouch ? '↓ Swipe down or pinch in to step back' : '↑ Scroll up to step back';
  function enterInside() {
    phase = 'inside';
    box.classList.add('inside');
    Sound.reveal();
  }
  function leaveInside() {
    phase = 'opened';
    box.classList.remove('inside');
  }

  /* ---------- answers ---------- */
  const yesBtn = $('yesBtn'), noBtn = $('noBtn');
  const noTexts = [T.no, ...T.noReplies];
  let noCount = 0, yesSize = 17;
  [yesBtn, noBtn].forEach(b => b.addEventListener('pointerenter', e => {
    if (e.pointerType === 'mouse' && phase === 'inside') Sound.scribble();
  }));
  noBtn.addEventListener('click', e => {
    e.stopPropagation();
    Sound.no();
    noCount++;
    noBtn.firstChild.textContent = noTexts[Math.min(noCount, noTexts.length - 1)] + ' ';
    yesSize = Math.min(yesSize + 1.5, 23);
    yesBtn.style.fontSize = yesSize + 'px';
    noBtn.style.fontSize = Math.max(17 - noCount, 12) + 'px';
  });
  yesBtn.addEventListener('click', e => {
    e.stopPropagation();
    yesBtn.classList.add('chosen');
    if (isTouch) Sound.scribble();
    setTimeout(() => { Sound.yes(); celebrate(); }, 650);
  });


  /* ---------- photo slideshow ---------- */
  let celebrating = false;
  function startGallery() {
    const list = CONFIG.photos || [];
    if (!list.length) return;
    const gal = $('gallery'), dotsEl = $('dots');
    const cards = list.map((ph, i) => {
      const c = document.createElement('figure');
      c.className = 'polaroid';
      c.style.setProperty('--rz', ((i % 2 ? 1 : -1) * (1.5 + Math.random() * 2.5)).toFixed(1) + 'deg');
      const pic = document.createElement('div');
      pic.className = 'pic';
      const img = new Image();
      img.onload = () => { pic.style.backgroundImage = `url("${ph.src}")`; };
      img.onerror = () => { pic.textContent = `📷 Photo not found: ${ph.src}`; };
      img.src = ph.src;
      const cap = document.createElement('figcaption');
      cap.className = 'cap';
      cap.textContent = ph.caption || '';
      c.append(pic, cap);
      gal.insertBefore(c, dotsEl);
      const d = document.createElement('i');
      dotsEl.appendChild(d);
      return c;
    });
    if (list.length < 2) { $('galPrev').style.display = $('galNext').style.display = 'none'; dotsEl.style.display = 'none'; }
    let cur = 0, timer = null;
    function show(n) {
      cur = (n + cards.length) % cards.length;
      cards.forEach((c, i) => {
        c.classList.toggle('active', i === cur);
        c.classList.toggle('prev', i !== cur && (i < cur || (cur === 0 && i === cards.length - 1 && cards.length > 2)));
      });
      [...dotsEl.children].forEach((d, i) => d.classList.toggle('on', i === cur));
    }
    function restart() {
      clearInterval(timer);
      if (cards.length > 1) timer = setInterval(() => show(cur + 1), CONFIG.slideSeconds * 1000);
    }
    $('galPrev').onclick = e => { e.stopPropagation(); show(cur - 1); restart(); };
    $('galNext').onclick = e => { e.stopPropagation(); show(cur + 1); restart(); };
    let sx = null;
    gal.addEventListener('pointerdown', e => { sx = e.clientX; });
    gal.addEventListener('pointerup', e => {
      if (sx === null) return;
      const dx = e.clientX - sx; sx = null;
      if (Math.abs(dx) > 40) { show(cur + (dx < 0 ? 1 : -1)); restart(); }
    });
    $('yay').classList.add('photos');
    requestAnimationFrame(() => { show(0); setTimeout(() => gal.classList.add('in'), 50); });
    restart();
  }

  function celebrate() {
    celebrating = true;
    $('yay').classList.add('visible');
    setTimeout(startGallery, CONFIG.photosDelay * 1000);
    const pieces = ['💖', '💕', '🌹', '💗', '✨', '❤️'];
    for (let i = 0; i < 80; i++) {
      setTimeout(() => {
        const c = document.createElement('span');
        c.className = 'confetti';
        c.textContent = pieces[Math.floor(Math.random() * pieces.length)];
        c.style.left = Math.random() * 100 + 'vw';
        c.style.fontSize = (16 + Math.random() * 22) + 'px';
        c.style.animationDuration = (2.8 + Math.random() * 2.5) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 6000);
      }, i * 45);
    }
  }
</script>
</body>
</html>
