<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You 💝</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #2a0a1f;
    --bg2: #5c1237;
    --pink: #ff6fa5;
    --rose: #e8335f;
    --cream: #fff4f0;
    --gold: #ffd36e;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    font-family: 'Quicksand', sans-serif;
    background: radial-gradient(ellipse at 50% 30%, var(--bg2), var(--bg1) 70%);
    color: var(--cream);
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    user-select: none;
  }

  /* ---------- floating background hearts ---------- */
  .bg-hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
  .bg-heart {
    position: absolute;
    bottom: -40px;
    color: var(--pink);
    opacity: 0;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    0%   { transform: translateY(0) rotate(0deg);   opacity: 0; }
    10%  { opacity: .55; }
    100% { transform: translateY(-110vh) rotate(25deg); opacity: 0; }
  }

  .stage {
    position: relative;
    z-index: 1;
    width: min(420px, 92vw);
    height: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-end;
  }

  .hint {
    position: absolute;
    top: 40px;
    font-family: 'Dancing Script', cursive;
    font-size: 2.1rem;
    text-align: center;
    color: var(--cream);
    text-shadow: 0 0 18px rgba(255,111,165,.6);
    animation: fadeIn 1.2s ease both, pulseText 2.4s ease-in-out 1.2s infinite;
    transition: opacity .5s;
  }
  @keyframes pulseText { 50% { transform: scale(1.05); } }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } }

  /* ---------- gift box ---------- */
  .gift {
    position: relative;
    width: 200px;
    height: 190px;
    margin-bottom: 40px;
    cursor: pointer;
    animation: drop 1s cubic-bezier(.3,1.6,.5,1) both, wiggle 2.2s ease-in-out 1.4s infinite;
    transform-origin: bottom center;
  }
  .gift.opened { animation: none; cursor: default; }
  @keyframes drop { from { transform: translateY(-120vh); } }
  @keyframes wiggle {
    0%, 80%, 100% { transform: rotate(0); }
    84% { transform: rotate(-4deg); }
    88% { transform: rotate(4deg); }
    92% { transform: rotate(-3deg); }
    96% { transform: rotate(2deg); }
  }
  .box {
    position: absolute;
    bottom: 0; left: 10px;
    width: 180px; height: 140px;
    background: linear-gradient(135deg, var(--rose), #b81d48);
    border-radius: 6px;
    box-shadow: inset -12px -12px 0 rgba(0,0,0,.12), 0 20px 40px rgba(0,0,0,.35);
    z-index: 2;
  }
  .box::before { /* vertical ribbon */
    content: '';
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 28px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, #ffd36e, #f3b33d);
  }
  .lid {
    position: absolute;
    top: 22px; left: 0;
    width: 200px; height: 42px;
    background: linear-gradient(135deg, #ff4f78, var(--rose));
    border-radius: 6px;
    box-shadow: 0 6px 0 rgba(0,0,0,.15);
    z-index: 3;
    transition: transform .9s cubic-bezier(.4,-0.3,.4,1.3), opacity .9s;
  }
  .lid::before {
    content: '';
    position: absolute;
    left: 50%; top: 0; bottom: 0;
    width: 30px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, #ffd36e, #f3b33d);
  }
  .bow {
    position: absolute;
    left: 50%; top: -34px;
    transform: translateX(-50%);
    width: 90px; height: 40px;
  }
  .bow span {
    position: absolute;
    top: 4px;
    width: 42px; height: 32px;
    border: 9px solid var(--gold);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
  }
  .bow span:first-child { left: 0;  transform: rotate(-20deg); }
  .bow span:last-child  { right: 0; transform: rotate(20deg); }
  .bow::after {
    content: '';
    position: absolute;
    left: 50%; top: 18px;
    width: 18px; height: 18px;
    transform: translateX(-50%);
    background: #f3b33d;
    border-radius: 50%;
  }
  .gift.opened .lid {
    transform: translate(140px, -260px) rotate(55deg);
    opacity: 0;
  }
  .gift.opened .box { animation: boxSink 1s ease 1.8s forwards; }
  @keyframes boxSink { to { transform: translateY(30px) scale(.9); opacity: .0; } }

  .glow {
    position: absolute;
    left: 50%; bottom: 120px;
    width: 10px; height: 10px;
    transform: translate(-50%, 0);
    border-radius: 50%;
    background: var(--gold);
    box-shadow: 0 0 60px 40px rgba(255, 211, 110, .55);
    opacity: 0;
    z-index: 1;
  }
  .gift.opened .glow { animation: burst 1.2s ease-out .3s; }
  @keyframes burst {
    0% { opacity: 0; transform: translate(-50%,0) scale(.2); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%,-60px) scale(3); }
  }

  /* ---------- bouquet ---------- */
  .bouquet {
    position: absolute;
    bottom: 40px;
    left: 50%;
    width: 320px;
    height: 360px;
    transform: translateX(-50%);
    pointer-events: none;
    z-index: 0;
  }
  .bouquet svg { width: 100%; height: 100%; overflow: visible; }
  .stem {
    fill: none;
    stroke: #4f9d5b;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-dasharray: 400;
    stroke-dashoffset: 400;
  }
  .leaf { fill: #5fb46b; transform-box: fill-box; transform: scale(0); }
  .bloom { transform-box: fill-box; transform-origin: center; transform: scale(0); }
  .wrap { opacity: 0; transform-box: fill-box; transform-origin: bottom center; }

  .show .stem  { animation: grow 1.4s ease forwards; }
  .show .leaf  { animation: pop .6s cubic-bezier(.3,1.7,.6,1) forwards; transform-origin: center; }
  .show .bloom { animation: bloom .9s cubic-bezier(.3,1.6,.5,1) forwards, sway 3.5s ease-in-out infinite; }
  .show .wrap  { animation: wrapIn .8s ease forwards; }
  @keyframes grow  { to { stroke-dashoffset: 0; } }
  @keyframes pop   { to { transform: scale(1); } }
  @keyframes bloom { to { transform: scale(1); } }
  @keyframes sway  { 0%,100% { rotate: -3deg; } 50% { rotate: 3deg; } }
  @keyframes wrapIn { from { opacity: 0; transform: scaleY(.3); } to { opacity: 1; transform: scaleY(1); } }

  /* ---------- question card ---------- */
  .card {
    position: absolute;
    top: 6px;
    width: 100%;
    text-align: center;
    opacity: 0;
    transform: translateY(20px);
    pointer-events: none;
    transition: opacity .9s ease, transform .9s ease;
    z-index: 5;
  }
  .card.visible { opacity: 1; transform: translateY(0); pointer-events: auto; }
  .card h1 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.3rem, 9vw, 3.2rem);
    line-height: 1.1;
    color: #fff;
    text-shadow: 0 0 20px rgba(255,111,165,.8), 0 2px 0 rgba(0,0,0,.25);
    margin-bottom: 22px;
  }
  .buttons {
    position: relative;
    display: flex;
    gap: 18px;
    justify-content: center;
    height: 54px;
  }
  .btn {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 1.1rem;
    border: none;
    border-radius: 999px;
    padding: 12px 34px;
    cursor: pointer;
    transition: transform .2s, box-shadow .2s, left .25s, top .25s;
  }
  .btn-yes {
    position: relative;
    z-index: 11;
    background: linear-gradient(135deg, #ff7eb0, var(--rose));
    color: #fff;
    box-shadow: 0 8px 24px rgba(232,51,95,.5);
  }
  .btn-yes:hover { transform: scale(1.08); box-shadow: 0 10px 30px rgba(232,51,95,.7); }
  .btn-no {
    background: rgba(255,255,255,.12);
    color: var(--cream);
    border: 1.5px solid rgba(255,255,255,.35);
    backdrop-filter: blur(4px);
  }
  .btn-no.runaway { position: fixed; z-index: 10; }

  /* ---------- yes screen ---------- */
  .yay {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 10px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 1s ease;
    z-index: 20;
    background: radial-gradient(ellipse at center, rgba(92,18,55,.85), rgba(42,10,31,.95));
  }
  .yay.visible { opacity: 1; pointer-events: auto; }
  .yay .big-heart {
    font-size: 6rem;
    animation: beat 1s ease-in-out infinite;
    filter: drop-shadow(0 0 25px rgba(255,111,165,.8));
  }
  @keyframes beat { 0%,100% { transform: scale(1); } 15% { transform: scale(1.25); } 30% { transform: scale(1); } 45% { transform: scale(1.15); } }
  .yay h2 {
    font-family: 'Dancing Script', cursive;
    font-size: clamp(2.4rem, 10vw, 3.6rem);
    color: #fff;
    text-shadow: 0 0 20px rgba(255,111,165,.8);
  }
  .yay p { font-size: 1.15rem; opacity: .85; }

  .confetti {
    position: fixed;
    top: -30px;
    pointer-events: none;
    z-index: 25;
    animation: fall linear forwards;
  }
  @keyframes fall { to { transform: translateY(115vh) rotate(540deg); opacity: .8; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>

<div class="bg-hearts" id="bgHearts"></div>

<main class="stage">
  <div class="hint" id="hint">A little something<br>for you… tap it 💌</div>

  <div class="card" id="card">
    <h1>Will you be<br>my Valentine?</h1>
    <div class="buttons">
      <button class="btn btn-yes" id="yesBtn">Yes 💖</button>
      <button class="btn btn-no" id="noBtn">No</button>
    </div>
  </div>

  <div class="bouquet" id="bouquet">
    <svg viewBox="0 0 320 360" aria-hidden="true">
      <!-- stems -->
      <path class="stem" style="animation-delay:.2s"  d="M160 350 C160 280 160 220 160 130"/>
      <path class="stem" style="animation-delay:.35s" d="M155 350 C140 280 110 230 85 165"/>
      <path class="stem" style="animation-delay:.5s"  d="M165 350 C180 280 210 230 235 165"/>
      <path class="stem" style="animation-delay:.65s" d="M150 350 C125 300 80 270 45 235"/>
      <path class="stem" style="animation-delay:.8s"  d="M170 350 C195 300 240 270 275 235"/>

      <!-- leaves -->
      <ellipse class="leaf" style="animation-delay:1.2s" cx="135" cy="270" rx="22" ry="8" transform="rotate(-30 135 270)"/>
      <ellipse class="leaf" style="animation-delay:1.35s" cx="187" cy="262" rx="22" ry="8" transform="rotate(30 187 262)"/>
      <ellipse class="leaf" style="animation-delay:1.5s" cx="100" cy="290" rx="18" ry="7" transform="rotate(-15 100 290)"/>

      <!-- side tulips -->
      <g class="bloom" style="animation-delay:1.5s, 2.4s">
        <path d="M45 245 C25 230 25 200 33 188 L45 205 L57 188 C65 200 65 230 45 245Z" fill="#ff9ec4"/>
        <path d="M45 245 C35 228 37 205 45 195 C53 205 55 228 45 245Z" fill="#ff7eb0"/>
      </g>
      <g class="bloom" style="animation-delay:1.65s, 2.6s">
        <path d="M275 245 C255 230 255 200 263 188 L275 205 L287 188 C295 200 295 230 275 245Z" fill="#ffd36e"/>
        <path d="M275 245 C265 228 267 205 275 195 C283 205 285 228 275 245Z" fill="#f3b33d"/>
      </g>

      <!-- roses -->
      <g class="bloom" style="animation-delay:1.3s, 2.3s">
        <circle cx="85" cy="160" r="30" fill="#e8335f"/>
        <circle cx="85" cy="160" r="21" fill="#c9244f"/>
        <path d="M85 160 m-12 0 a12 12 0 1 1 24 0 a8 8 0 1 1 -16 0 a4 4 0 1 1 8 0" fill="none" stroke="#ff6f8f" stroke-width="3"/>
      </g>
      <g class="bloom" style="animation-delay:1.45s, 2.5s">
        <circle cx="235" cy="160" r="30" fill="#ff6fa5"/>
        <circle cx="235" cy="160" r="21" fill="#e8508a"/>
        <path d="M235 160 m-12 0 a12 12 0 1 1 24 0 a8 8 0 1 1 -16 0 a4 4 0 1 1 8 0" fill="none" stroke="#ffb3d0" stroke-width="3"/>
      </g>
      <g class="bloom" style="animation-delay:1.1s, 2.2s">
        <circle cx="160" cy="120" r="38" fill="#e8335f"/>
        <circle cx="160" cy="120" r="27" fill="#b81d48"/>
        <path d="M160 120 m-15 0 a15 15 0 1 1 30 0 a10 10 0 1 1 -20 0 a5 5 0 1 1 10 0" fill="none" stroke="#ff6f8f" stroke-width="3.5"/>
      </g>

      <!-- little white baby's breath -->
      <g class="bloom" style="animation-delay:1.8s, 2.8s" fill="#fff">
        <circle cx="120" cy="120" r="4"/><circle cx="112" cy="128" r="3"/><circle cx="125" cy="132" r="3"/>
        <circle cx="200" cy="118" r="4"/><circle cx="208" cy="128" r="3"/><circle cx="195" cy="130" r="3"/>
        <circle cx="60" cy="200" r="3"/><circle cx="260" cy="200" r="3"/>
      </g>

      <!-- wrapping paper -->
      <path class="wrap" style="animation-delay:.9s" d="M105 255 L215 255 L180 350 L140 350 Z" fill="#fff4f0"/>
      <path class="wrap" style="animation-delay:.9s" d="M105 255 L160 255 L150 350 L140 350 Z" fill="#f7dcd6"/>
      <path class="wrap" style="animation-delay:1.1s" d="M135 300 q25 -14 50 0 q-25 14 -50 0z M160 300 l-14 26 M160 300 l14 26" fill="#e8335f" stroke="#e8335f" stroke-width="4" stroke-linecap="round"/>
    </svg>
  </div>

  <div class="gift" id="gift" role="button" aria-label="Open the gift" tabindex="0">
    <div class="glow"></div>
    <div class="lid"><div class="bow"><span></span><span></span></div></div>
    <div class="box"></div>
  </div>
</main>

<section class="yay" id="yay">
  <div class="big-heart">💖</div>
  <h2>Yay! I love you!</h2>
  <p>Happy Valentine's Day, my love 🌹</p>
</section>

<script>
  // floating background hearts
  const bg = document.getElementById('bgHearts');
  const heartChars = ['❤', '💕', '💗', '♥'];
  for (let i = 0; i < 22; i++) {
    const h = document.createElement('span');
    h.className = 'bg-heart';
    h.textContent = heartChars[i % heartChars.length];
    h.style.left = Math.random() * 100 + 'vw';
    h.style.fontSize = (12 + Math.random() * 22) + 'px';
    h.style.animationDuration = (8 + Math.random() * 10) + 's';
    h.style.animationDelay = (Math.random() * 12) + 's';
    bg.appendChild(h);
  }

  const gift = document.getElementById('gift');
  const hint = document.getElementById('hint');
  const bouquet = document.getElementById('bouquet');
  const card = document.getElementById('card');

  function openGift() {
    if (gift.classList.contains('opened')) return;
    gift.classList.add('opened');
    hint.style.opacity = 0;
    setTimeout(() => bouquet.classList.add('show'), 600);
    setTimeout(() => card.classList.add('visible'), 3400);
  }
  gift.addEventListener('click', openGift);
  gift.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') openGift(); });

  // the "No" button runs away
  const noBtn = document.getElementById('noBtn');
  const yesBtn = document.getElementById('yesBtn');
  let yesScale = 1;
  const noTexts = ['No', 'Are you sure?', 'Really?', 'Think again 🥺', 'Pleaseee', 'Nope, try Yes'];
  let noCount = 0;

  function runAway(e) {
    if (e) e.preventDefault();
    const r = noBtn.getBoundingClientRect();
    if (!noBtn.classList.contains('runaway')) {
      noBtn.style.left = r.left + 'px';
      noBtn.style.top = r.top + 'px';
      noBtn.classList.add('runaway');
    }
    const pad = 20;
    const maxX = window.innerWidth - r.width - pad;
    const maxY = window.innerHeight - r.height - pad;
    const y = yesBtn.getBoundingClientRect();
    const gap = 30;
    let x, top, tries = 0;
    do {
      x = Math.max(pad, Math.random() * maxX);
      top = Math.max(pad, Math.random() * maxY);
      tries++;
    } while (tries < 50 &&
      x < y.right + gap && x + r.width > y.left - gap &&
      top < y.bottom + gap && top + r.height > y.top - gap);
    noBtn.style.left = x + 'px';
    noBtn.style.top = top + 'px';
    noCount++;
    noBtn.textContent = noTexts[Math.min(noCount, noTexts.length - 1)];
    yesScale = Math.min(yesScale + 0.12, 1.8);
    yesBtn.style.transform = `scale(${yesScale})`;
  }
  noBtn.addEventListener('mouseenter', runAway);
  noBtn.addEventListener('touchstart', runAway, { passive: false });
  noBtn.addEventListener('click', runAway);

  // Yes!
  yesBtn.addEventListener('click', () => {
    noBtn.style.display = 'none';
    document.getElementById('yay').classList.add('visible');
    const pieces = ['💖', '💕', '🌹', '💗', '✨', '❤️'];
    for (let i = 0; i < 70; i++) {
      setTimeout(() => {
        const c = document.createElement('span');
        c.className = 'confetti';
        c.textContent = pieces[Math.floor(Math.random() * pieces.length)];
        c.style.left = Math.random() * 100 + 'vw';
        c.style.fontSize = (16 + Math.random() * 20) + 'px';
        c.style.animationDuration = (2.5 + Math.random() * 2.5) + 's';
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 5500);
      }, i * 45);
    }
  });
</script>
</body>
</html>
